<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription Confirmed | LLCT Solutions</title>
    <meta name="robots" content="noindex" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --primary: #07549a;
            --accent: #6bb6e6;
            --dark-text: #12395f;
            --gray-text: #4a6178;
            --light-bg: #eef5fb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-bg);
            color: var(--dark-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            max-width: 480px;
            width: 100%;
            padding: 48px 36px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 24px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 12px;
        }
        p { color: var(--gray-text); line-height: 1.7; margin-bottom: 24px; }
        a.btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 600;
        }
        small { display: block; margin-top: 16px; color: var(--gray-text); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-check"></i></div>
        <h1>Thanks for subscribing</h1>
        <p>
            Your payment is being confirmed with PayFast — this usually takes
            a moment. You'll receive a confirmation once it's complete.
        </p>
        <a class="btn" href="/index.html">Back to LLCT Solutions</a>
        <small>Questions? WhatsApp us on +27 68 458 7964.</small>
    </div>
</body>
</html>
