<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLCT Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section class="admin-login" id="adminLogin">
      <p class="section-tag">Private area</p>
      <h1>LLCT Admin</h1>
      <p>Manage articles and review subscription records.</p>
      <form id="loginForm" class="admin-form">
        <label for="adminPassword">Admin password</label>
        <input id="adminPassword" type="password" required autocomplete="current-password" />
        <button class="btn-primary" type="submit">Sign in</button>
        <p class="admin-message error" id="loginMessage" hidden></p>
      </form>
    </section>

    <section class="admin-dashboard" id="adminDashboard" hidden>
      <header class="admin-header">
        <div><p class="section-tag">Control centre</p><h1>LLCT Admin</h1></div>
        <button class="btn-outline" id="logoutButton" type="button">Sign out</button>
      </header>

      <div class="admin-grid">
        <section class="admin-panel">
          <h2 id="articleFormHeading">Publish an article</h2>
          <p>Upload a text-based PDF. Its text will be extracted and shown publicly in Resources.</p>
          <form id="articleForm" class="admin-form">
            <input id="articleId" type="hidden" />
            <label for="articleTitle">Article title</label>
            <input id="articleTitle" name="title" required maxlength="180" />
            <label for="articlePdf">PDF file</label>
            <input id="articlePdf" name="pdf" type="file" accept="application/pdf,.pdf" />
            <div class="article-form-actions">
              <button class="btn-primary" id="articleSubmitButton" type="submit">Upload and publish</button>
              <button class="btn-outline" id="cancelArticleEdit" type="button" hidden>Cancel edit</button>
            </div>
            <p class="admin-message" id="articleMessage" hidden></p>
          </form>
        </section>

        <section class="admin-panel admin-wide">
          <div class="panel-heading"><h2>Subscribers</h2><button class="btn-outline" id="refreshSubscribers" type="button">Refresh</button></div>
          <div class="table-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Type</th><th>Plan</th><th>Status</th></tr></thead><tbody id="subscriberRows"></tbody></table></div>
          <p class="admin-message" id="subscriberMessage" hidden></p>
        </section>

        <section class="admin-panel admin-wide">
          <h2>Published articles</h2>
          <div id="adminArticleList" class="admin-article-list"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
